[package]
name = "dragonfly-client-storage"
description = "Storage for the dragonfly client"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
dragonfly-client-core.workspace = true
dragonfly-client-config.workspace = true
dragonfly-client-metric.workspace = true
dragonfly-client-util.workspace = true
dragonfly-api.workspace = true
chrono.workspace = true
dashmap.workspace = true
reqwest.workspace = true
rocksdb.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
tracing.workspace = true
prost-wkt-types.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
getrandom = { workspace = true, optional = true }
crc32fast.workspace = true
fs2.workspace = true
bytes.workspace = true
bytesize.workspace = true
hmac = { workspace = true, optional = true }
leaky-bucket.workspace = true
sha2 = { workspace = true, optional = true }
vortex-protocol.workspace = true
bincode = "1.3.3"
walkdir = "2.5.0"
quinn = { version = "0.11.9", default-features = false, features = [
  "bloom",
  "log",
  "platform-verifier",
  "runtime-tokio",
  "rustls-aws-lc-rs",
] }
socket2 = "0.6.3"
rustix = { version = "1.1.3", features = ["fs"] }
memmap2 = { version = "0.9", optional = true }

[features]
# Enables the Linux UMDK/URMA piece transport.
urma = [
  "dep:bindgen",
  "dep:cc",
  "dep:getrandom",
  "dep:hmac",
  "dep:memmap2",
  "dep:sha2",
]
# Deterministic real-provider failure injection for validation binaries only.
urma-test-failpoints = ["urma"]

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = { version = "1.2.32", optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion = "0.5"

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "lru_cache"
harness = false
